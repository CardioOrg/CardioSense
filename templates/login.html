{% extends "base.html" %}
{% block title %}Login — CardioSense{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span style="color:var(--cs-primary);">❤</span> CardioSense
        </div>
        <h4 class="text-center mb-4 fw-bold">Welcome Back</h4>

        <div id="auth-error" class="text-danger text-center mb-3 fw-semibold"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" required placeholder="you@example.com">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" required placeholder="••••••••"
                        minlength="6">
                </div>
            </div>
            <button type="submit" id="login-btn" class="btn btn-cs w-100 py-2">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted mb-0">
            New here?
            <a href="{{ url_for('auth.signup_patient') }}" class="fw-semibold" style="color:var(--cs-primary);">Sign up
                as Patient</a>
            or
            <a href="{{ url_for('auth.signup_doctor') }}" class="fw-semibold" style="color:var(--cs-primary);">Sign up
                as Doctor</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const firebaseConfig = {
        apiKey: "{{ config.FIREBASE_API_KEY or '' }}",
        authDomain: "{{ config.FIREBASE_PROJECT_ID }}.firebaseapp.com",
        projectId: "{{ config.FIREBASE_PROJECT_ID }}",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleLogin = async function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');
        const errDiv = document.getElementById('auth-error');
        btn.disabled = true;
        btn.innerHTML = '<span class="cs-spinner"></span> Signing in...';
        errDiv.textContent = '';

        try {
            const result = await signInWithEmailAndPassword(auth, email, password);
            const idToken = await result.user.getIdToken();
            const resp = await fetch('/auth/session-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken }),
            });
            const data = await resp.json();
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                errDiv.textContent = data.error || 'Login failed.';
            }
        } catch (error) {
            let msg = 'Login failed. Please check your credentials.';
            if (error.code === 'auth/user-not-found') msg = 'No account found with this email.';
            else if (error.code === 'auth/wrong-password') msg = 'Incorrect password.';
            else if (error.code === 'auth/invalid-credential') msg = 'Invalid email or password.';
            errDiv.textContent = msg;
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
        }
    };
</script>
{% endblock %}
