{% extends "base.html" %}
{% block title %}Patient Sign Up — CardioSense{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span style="color:var(--cs-primary);">❤</span> CardioSense
        </div>
        <h4 class="text-center mb-1 fw-bold">Create Patient Account</h4>
        <p class="text-center text-muted mb-4">Track your cardiovascular health</p>

        <div id="auth-error" class="text-danger text-center mb-3 fw-semibold"></div>

        <form id="signup-form" onsubmit="handleSignup(event)">
            <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="fullName" required placeholder="John Doe">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="email" required placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Min 6 characters"
                    minlength="6">
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required
                    placeholder="Re-enter password" minlength="6">
            </div>
            <button type="submit" id="signup-btn" class="btn btn-cs w-100 py-2">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted mb-0">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-semibold"
                style="color:var(--cs-primary);">Login</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const firebaseConfig = {
        apiKey: "{{ config.FIREBASE_API_KEY or '' }}",
        authDomain: "{{ config.FIREBASE_PROJECT_ID }}.firebaseapp.com",
        projectId: "{{ config.FIREBASE_PROJECT_ID }}",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleSignup = async function (e) {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('signup-btn');
        const errDiv = document.getElementById('auth-error');

        if (password !== confirm) { errDiv.textContent = 'Passwords do not match.'; return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="cs-spinner"></span> Creating...';
        errDiv.textContent = '';

        try {
            const result = await createUserWithEmailAndPassword(auth, email, password);
            const idToken = await result.user.getIdToken();
            const resp = await fetch('/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken, role: 'patient', fullName }),
            });
            const data = await resp.json();
            if (data.success) { window.location.href = data.redirect; }
            else { errDiv.textContent = data.error || 'Signup failed.'; }
        } catch (error) {
            let msg = 'Signup failed.';
            if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered.';
            else if (error.code === 'auth/weak-password') msg = 'Password must be at least 6 characters.';
            errDiv.textContent = msg;
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-plus"></i> Create Account';
        }
    };
</script>
{% endblock %}
